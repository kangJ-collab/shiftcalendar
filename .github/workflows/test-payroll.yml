name: 급여 계산 검증

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  payroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_payroll.js
